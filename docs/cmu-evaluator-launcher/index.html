<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; connect-src https://*.up.railway.app; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    >
    <title>Starting the annotation tool</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f4f1ea;
        color: #20231f;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      main {
        width: min(34rem, 100%);
        padding: 2.25rem;
        background: #fffdf8;
        border: 1px solid #ded9cd;
        border-radius: 1rem;
        box-shadow: 0 1rem 3rem rgb(42 45 39 / 10%);
        text-align: center;
      }
      .spinner {
        width: 2.75rem;
        height: 2.75rem;
        margin: 0 auto 1.35rem;
        border: 0.3rem solid #d8dfd2;
        border-top-color: #356044;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      h1 { margin: 0 0 0.75rem; font-size: clamp(1.45rem, 4vw, 2rem); }
      p { margin: 0.55rem 0; line-height: 1.55; }
      #status { color: #4c564c; }
      #details { color: #7a332b; }
      button {
        margin-top: 1.25rem;
        padding: 0.75rem 1.1rem;
        border: 0;
        border-radius: 0.55rem;
        background: #356044;
        color: white;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      button[hidden] { display: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" id="spinner" aria-hidden="true"></div>
      <h1 id="title">Starting the annotation tool…</h1>
      <p id="status" role="status" aria-live="polite">
        The secure service was resting while unused. It will open automatically when ready.
      </p>
      <p id="details"></p>
      <button id="retry" type="button" hidden>Try again</button>
    </main>
    <script>
      (() => {
        "use strict";

        const params = new URLSearchParams(window.location.hash.slice(1));
        const status = document.getElementById("status");
        const details = document.getElementById("details");
        const retry = document.getElementById("retry");
        const spinner = document.getElementById("spinner");
        const title = document.getElementById("title");
        const safeId = /^[A-Za-z0-9._-]{1,128}$/;
        let service;

        function failConfiguration(message) {
          spinner.hidden = true;
          title.textContent = "This annotation link is invalid";
          status.textContent = "Please ask the researcher for a new link.";
          details.textContent = message;
        }

        try {
          service = new URL(params.get("service") || "");
        } catch (_error) {
          failConfiguration("The service address is missing or malformed.");
          return;
        }

        const hostname = service.hostname.toLowerCase();
        const campaignId = params.get("campaign_id") || "";
        const userId = params.get("user_id") || "";
        const backupToken = params.get("backup_token") || "";
        const safeToken = /^[A-Za-z0-9_-]{43}$/;
        const serviceIsValid =
          service.protocol === "https:" &&
          hostname.endsWith(".up.railway.app") &&
          hostname !== ".up.railway.app" &&
          service.username === "" &&
          service.password === "" &&
          service.port === "" &&
          (service.pathname === "" || service.pathname === "/") &&
          service.search === "" &&
          service.hash === "";

        if (
          !serviceIsValid ||
          !safeId.test(campaignId) ||
          !safeId.test(userId) ||
          !safeToken.test(backupToken)
        ) {
          failConfiguration("The service, campaign, or participant identifier is invalid.");
          return;
        }

        const origin = `https://${hostname}`;
        const destination = new URL("/annotate", origin);
        destination.searchParams.set("campaign_id", campaignId);
        destination.searchParams.set("user_id", userId);
        destination.hash = new URLSearchParams({ backup_token: backupToken }).toString();
        let deadline = Date.now() + 120000;
        let attemptNumber = 0;
        let running = false;

        const wait = (milliseconds) =>
          new Promise((resolve) => window.setTimeout(resolve, milliseconds));

        async function wake() {
          if (running) return;
          running = true;
          retry.hidden = true;
          spinner.hidden = false;
          details.textContent = "";

          while (Date.now() < deadline) {
            attemptNumber += 1;
            status.textContent =
              attemptNumber === 1
                ? "Waking the secure service…"
                : `Still starting… check ${attemptNumber}`;
            const controller = new AbortController();
            const timeout = window.setTimeout(() => controller.abort(), 8000);
            try {
              const health = new URL("/healthz", origin);
              health.searchParams.set("wake", String(Date.now()));
              const response = await fetch(health, {
                cache: "no-store",
                credentials: "omit",
                redirect: "error",
                signal: controller.signal,
              });
              const body = response.ok ? (await response.text()).trim() : "";
              if (response.ok && body === "ok") {
                status.textContent = "Ready. Opening your annotation page…";
                window.location.replace(destination.href);
                return;
              }
            } catch (_error) {
              // A sleeping Railway service may fail its first request. Retrying
              // is the expected wake-up path, not an annotator-facing error.
            } finally {
              window.clearTimeout(timeout);
            }
            await wait(Math.min(1000 + attemptNumber * 500, 5000));
          }

          running = false;
          spinner.hidden = true;
          status.textContent = "The service is taking longer than expected to start.";
          details.textContent = "You can retry safely; your previous annotations are stored separately.";
          retry.hidden = false;
        }

        retry.addEventListener("click", () => {
          deadline = Date.now() + 120000;
          attemptNumber = 0;
          void wake();
        });
        void wake();
      })();
    </script>
  </body>
</html>
