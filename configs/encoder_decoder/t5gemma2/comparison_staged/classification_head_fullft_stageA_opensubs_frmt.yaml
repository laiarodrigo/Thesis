seed: 42

model:
  base_model: google/t5gemma-2-270m-270m
  trust_remote_code: true
  num_labels: 3
  freeze_decoder: true
  dropout: 0.1
  label2id:
    pt-br: 0
    pt-pt: 1
    equal: 2
  id2label:
    "0": pt-br
    "1": pt-pt
    "2": equal
  max_source_length: 512

dataset:
  train_path: data/encoder_decoder/t5gemma2/compare_staged_v2/stageA_opensubs_only/classification_train.jsonl
  valid_path: data/encoder_decoder/t5gemma2/compare_staged_v2/stageA_opensubs_only/classification_valid.jsonl

lora:
  enabled: false

training:
  output_dir: outputs/encoder_decoder/compare_staged/t5gemma2_270m_classification_head_fullft_stageA_opensubs_frmt
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_steps: 150
  max_steps: 1600
  num_train_epochs: 3
  logging_steps: 20
  eval_strategy: steps
  eval_steps: 100
  save_steps: 200
  save_total_limit: 2
  save_checkpoints: false
  load_best_model_at_end: false
  metric_for_best_model: eval_f1_macro
  greater_is_better: true
  bf16: true
  fp16: false
  gradient_checkpointing: false
  dataloader_num_workers: 4
