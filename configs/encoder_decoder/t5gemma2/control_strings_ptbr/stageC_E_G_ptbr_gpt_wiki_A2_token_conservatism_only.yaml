seed: 42

model:
  base_model: outputs/encoder_decoder/control_strings_ptbr_270m/t5gemma2_270m_fullft_stageB_gpt_wiki_encoder_ptbr
  trust_remote_code: true
  max_source_length: 512
  max_target_length: 512
  encoder_input_format: task_prefix
  decoder_target_format: plain
  encoder_br_token: BR
  encoder_pt_token: PT

dataset:
  train_path: data/encoder_decoder/stage_c_subset/gpt_wiki_data_legit/stage_c_subset.jsonl

lora:
  enabled: false

reward:
  metric: bleu_ter
  include_token_conservatism_reward: true
  bleu_weight: 0.45
  ter_weight: 0.45
  token_conservatism_weight: 0.10
  epsilon: 1.0e-8
  copy_penalty: 0.10

rl:
  algorithm: dr_grpo
  beta: 0.0
  num_generations: 4
  include_reference_candidate: true
  loss_mix_mode: reference_candidate_auto
  rl_weight: 1.0
  sft_weight: 0.05
  do_sample: true
  temperature: 0.8
  top_p: 0.95
  max_completion_length: 128
  no_repeat_ngram_size: 0
  early_stopping: false
  advantage_eps: 1.0e-6

training:
  output_dir: outputs/encoder_decoder/control_strings_ptbr_270m/t5gemma2_270m_fullft_stageC_E_G_ptbr_gpt_wiki_A2_token_conservatism_only
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  weight_decay: 0.0
  warmup_steps: 10
  max_steps: 1200
  logging_steps: 10
  debug_candidate_every_steps: 20
  debug_candidate_examples: 1
  save_steps: 200
  save_total_limit: 2
  bf16: true
  fp16: false
  require_bf16: true
  gradient_checkpointing: true
  max_grad_norm: 1.0
  lr_scheduler_type: linear
