seed: 42

model:
  base_model: google/t5gemma-2-4b-4b
  trust_remote_code: true
  max_source_length: 384
  max_target_length: 256

dataset:
  train_path: data/encoder_decoder/t5gemma2/compare_staged_v2/multitask_stageA/train.jsonl
  valid_path: data/encoder_decoder/t5gemma2/compare_staged_v2/multitask_stageA/train.jsonl
  max_valid_rows: 20000

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: outputs/encoder_decoder/multitask_compare/t5gemma2_4b_multitask_r8_stageA_compare_staged_v2
  loss_mode: cross_entropy_only
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 400
  max_steps: 5000
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  bf16: true
  fp16: false
  gradient_checkpointing: true
  dataloader_num_workers: 8
