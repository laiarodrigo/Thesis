seed: 42

model:
  base_model: google/t5gemma-2-4b-4b
  trust_remote_code: true
  max_source_length: 512
  max_target_length: 512

dataset:
  train_path: data/encoder_decoder/t5gemma2/compare_staged_v2/multitask_stageB_gpt_wiki_frmt_noequal/train.jsonl
  valid_path: data/encoder_decoder/t5gemma2/compare_staged_v2/multitask_stageB_gpt_wiki_frmt_noequal/valid.jsonl
  max_valid_rows: 20000

lora:
  enabled: true
  init_adapter_path: outputs/encoder_decoder/compare_staged/t5gemma2_4b_translation_r48_stageA_opensubs_only

training:
  output_dir: outputs/encoder_decoder/multitask_compare/t5gemma2_4b_multitask_r48_stageB_gpt_wiki_frmt_from_translation_stageA_noequal
  loss_mode: cross_entropy_only
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 150
  max_steps: 1200
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 100
  save_steps: 100
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  bf16: false
  fp16: true
  gradient_checkpointing: true
  dataloader_num_workers: 8
