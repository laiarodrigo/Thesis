seed: 42

model:
  base_model: google/t5gemma-2-4b-4b
  trust_remote_code: true
  max_source_length: 512
  max_target_length: 512
  require_control_strings_atomic: true
  control_strings:
    - BR
    - PT

dataset:
  train_path: data/encoder_decoder/t5gemma2/control_string_ptbr_protocol/stageB_gpt_wiki/decoder_unified/train.jsonl
  valid_path: data/encoder_decoder/t5gemma2/control_string_ptbr_protocol/stageB_gpt_wiki/decoder_unified/valid.jsonl
  task_column: task

lora:
  enabled: true
  init_adapter_path: outputs/encoder_decoder/control_strings_ptbr/t5gemma2_4b_stageA_opensubs_decoder_ptbr
  r: 48
  alpha: 96
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: outputs/encoder_decoder/control_strings_ptbr/t5gemma2_4b_stageB_gpt_wiki_decoder_ptbr
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 150
  max_steps: 1200
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 100
  save_total_limit: 2
  early_stopping_patience: 3
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  do_eval: true
  bf16: true
  fp16: false
  require_bf16: true
  require_early_stopping: true
  gradient_checkpointing: true
  dataloader_num_workers: 8
