base_model: Qwen/Qwen3.5-9B
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
trust_remote_code: true
chat_template: qwen3

load_in_8bit: false
load_in_4bit: true
adapter: qlora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

datasets:
  - path: data/decoder_only/qwen3_translation_stageA_opensubs_only/train.jsonl
    ds_type: json
    type: chat_template
    field_messages: messages
    roles_to_train:
      - assistant

test_datasets:
  - path: data/decoder_only/qwen3_translation_stageA_opensubs_only/valid.jsonl
    ds_type: json
    type: chat_template
    field_messages: messages
    roles_to_train:
      - assistant

dataset_prepared_path: data/decoder_only/qwen3_5_9b_translation_stageA_opensubs_only/prepared
output_dir: outputs/decoder_only/qwen3_5_9b_translation_stageA_opensubs_only_qlora

sequence_len: 512
sample_packing: false
pad_to_sequence_len: true

micro_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
weight_decay: 0.01
warmup_steps: 200
max_steps: 2500

gradient_checkpointing: true
bf16: true
fp16: false
tf32: true

logging_steps: 50
eval_steps: 200
save_steps: 500
save_total_limit: 2
early_stopping_patience: 8

load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
